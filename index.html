<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coin Flip Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      padding: 20px;
    }

    /* ── LOGIN SCREEN ── */
    #loginScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .login-box {
      background: #ffffff0d;
      border: 1px solid #ffffff20;
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 60px #00000066;
    }

    .login-box h2 {
      font-size: 2rem;
      color: #f5c518;
      margin-bottom: 6px;
      letter-spacing: 2px;
    }

    .login-box p {
      color: #aaa;
      font-size: 0.85rem;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .login-box input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 50px;
      border: 1px solid #ffffff25;
      background: #ffffff0f;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-box input::placeholder { color: #888; }
    .login-box input:focus { border-color: #f5c51888; }

    .login-box button {
      width: 100%;
      padding: 13px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, #e94560, #c0392b);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 24px #e9456066;
      transition: transform 0.15s, box-shadow 0.15s;
      margin-top: 4px;
    }

    .login-box button:hover { transform: translateY(-2px); box-shadow: 0 8px 30px #e9456099; }
    .login-box button:active { transform: scale(0.97); }

    .login-error {
      color: #e94560;
      font-size: 0.82rem;
      margin-top: 10px;
      min-height: 18px;
    }

    .welcome-badge {
      position: fixed;
      top: 16px;
      right: 16px;
      background: #ffffff10;
      border: 1px solid #ffffff20;
      border-radius: 50px;
      padding: 7px 16px;
      font-size: 0.82rem;
      color: #f5c518;
      letter-spacing: 1px;
      z-index: 10;
    }

    #gameScreen { display: none; width: 100%; display: none; flex-direction: column; align-items: center; }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 6px;
      letter-spacing: 2px;
      text-shadow: 0 0 20px #e94560aa;
      color: #f5c518;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 36px;
      letter-spacing: 1px;
    }

    /* ── COIN ── */
    .coin-wrapper {
      width: 180px;
      height: 180px;
      perspective: 600px;
      margin-bottom: 32px;
    }

    .coin {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s;
    }

    .coin.flipping {
      animation: coinSpin 1.2s ease-out forwards;
    }

    @keyframes coinSpin {
      0%   { transform: rotateY(0deg) rotateX(0deg); }
      20%  { transform: rotateY(360deg) rotateX(20deg); }
      40%  { transform: rotateY(720deg) rotateX(0deg); }
      60%  { transform: rotateY(1080deg) rotateX(20deg); }
      80%  { transform: rotateY(1440deg) rotateX(0deg); }
      90%  { transform: rotateY(1620deg) rotateX(0deg); }
      100% { transform: rotateY(1800deg) rotateX(0deg); }
    }

    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      font-weight: 900;
      border: 6px solid #b8860b;
      box-shadow: 0 0 30px #f5c51866, inset 0 0 20px #00000044;
      user-select: none;
    }

    .coin-heads {
      background: radial-gradient(circle at 35% 35%, #ffd700, #b8860b 70%);
      color: #5a3e00;
    }

    .coin-tails {
      background: radial-gradient(circle at 35% 35%, #e8e8e8, #888 70%);
      color: #333;
      transform: rotateY(180deg);
    }

    /* show tails face when result is tails */
    .coin.show-tails {
      transform: rotateY(180deg);
    }

    /* ── RESULT INDICATOR ── */
    .result-indicator {
      height: 44px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .result-badge {
      padding: 8px 28px;
      border-radius: 50px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 2px;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.3s, transform 0.3s;
    }

    .result-badge.visible {
      opacity: 1;
      transform: scale(1);
    }

    .result-badge.heads {
      background: linear-gradient(90deg, #f5c518, #ff9800);
      color: #1a1a2e;
      box-shadow: 0 4px 20px #f5c51866;
    }

    .result-badge.tails {
      background: linear-gradient(90deg, #a8a8a8, #666);
      color: #fff;
      box-shadow: 0 4px 20px #ffffff33;
    }

    /* ── BUTTONS ── */
    .btn-row {
      display: flex;
      gap: 14px;
      margin-bottom: 36px;
    }

    button {
      padding: 14px 40px;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    }

    button:active { transform: scale(0.96); }

    #flipBtn {
      background: linear-gradient(135deg, #e94560, #c0392b);
      color: #fff;
      box-shadow: 0 6px 24px #e9456066;
    }

    #flipBtn:hover:not(:disabled) { box-shadow: 0 8px 30px #e9456099; transform: translateY(-2px); }
    #flipBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    #flipBtn.holding {
      background: linear-gradient(135deg, #ff7c2a, #e94530);
      animation: saberPulse 0.65s ease-in-out infinite;
      position: relative;
      overflow: visible;
    }

    @keyframes saberPulse {
      0%   { box-shadow: 0 0 14px #ff8833cc, 0 0 32px #ff5c1aaa, 0 0 60px #ff3d0077, 0 0 90px #ff220044; }
      50%  { box-shadow: 0 0 22px #ffaa55ff, 0 0 50px #ff6622cc, 0 0 90px #ff4400aa, 0 0 130px #ff220066; }
      100% { box-shadow: 0 0 14px #ff8833cc, 0 0 32px #ff5c1aaa, 0 0 60px #ff3d0077, 0 0 90px #ff220044; }
    }

    #flipBtn.holding::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50px;
      border: 2.5px solid #ff9944dd;
      box-shadow: 0 0 10px #ff7733bb, 0 0 22px #ff550088;
      animation: ringPulse 0.65s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes ringPulse {
      0%   { inset: -6px;  opacity: 0.9; border-color: #ff9944dd; box-shadow: 0 0 10px #ff7733bb, 0 0 22px #ff550088; }
      50%  { inset: -16px; opacity: 1;   border-color: #ffbb66ff; box-shadow: 0 0 18px #ffaa44ff, 0 0 40px #ff6600bb; }
      100% { inset: -6px;  opacity: 0.9; border-color: #ff9944dd; box-shadow: 0 0 10px #ff7733bb, 0 0 22px #ff550088; }
    }

    #resetBtn {
      background: linear-gradient(135deg, #2d6a4f, #1b4332);
      color: #d8f3dc;
      box-shadow: 0 6px 24px #2d6a4f55;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
    }

    #resetBtn:hover { box-shadow: 0 8px 30px #2d6a4f88; transform: translateY(-2px); }

    #resetBtn.pulsing {
      animation: resetPulse 0.35s ease-out forwards;
    }

    @keyframes resetPulse {
      0%   { transform: scale(1);    box-shadow: 0 6px 24px #2d6a4f55; }
      40%  { transform: scale(1.18); box-shadow: 0 0 30px #7b2fff99, 0 0 60px #5500cc66; background: linear-gradient(135deg, #7b2fff, #4400bb); }
      100% { transform: scale(1);    box-shadow: 0 6px 24px #2d6a4f55; }
    }

    /* ── KAMUI OVERLAY ── */
    #kamuiCanvas {
      position: fixed;
      inset: 0;
      z-index: 500;
      pointer-events: none;
      opacity: 0;
    }

    #kamuiCanvas.active { opacity: 1; }

    #gameScreen.kamui-out {
      animation: kamuiSuck 1.1s cubic-bezier(0.6, 0, 1, 0.8) forwards;
    }

    #gameScreen.kamui-in {
      animation: kamuiReturn 0.7s cubic-bezier(0, 0.8, 0.4, 1) forwards;
    }

    @keyframes kamuiSuck {
      0%   { transform: scale(1)    rotate(0deg);   opacity: 1; filter: blur(0px); }
      60%  { transform: scale(0.55) rotate(180deg); opacity: 0.7; filter: blur(2px); }
      100% { transform: scale(0)    rotate(360deg); opacity: 0;   filter: blur(8px); }
    }

    @keyframes kamuiReturn {
      0%   { transform: scale(0)   rotate(-360deg); opacity: 0;   filter: blur(8px); }
      60%  { transform: scale(1.07) rotate(-15deg); opacity: 0.9; filter: blur(1px); }
      100% { transform: scale(1)   rotate(0deg);   opacity: 1;   filter: blur(0px); }
    }

    /* ── STATS ── */
    .stats {
      display: flex;
      gap: 24px;
      margin-bottom: 28px;
    }

    .stat-box {
      background: #ffffff0d;
      border: 1px solid #ffffff18;
      border-radius: 14px;
      padding: 14px 24px;
      text-align: center;
      min-width: 110px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #aaa;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .stat-value.heads-color { color: #f5c518; }
    .stat-value.tails-color { color: #b0b0b0; }
    .stat-value.total-color { color: #a29bfe; }

    /* ── PERCENTAGE BAR ── */
    .pct-section {
      width: 100%;
      max-width: 420px;
      margin-bottom: 32px;
    }

    .pct-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #ccc;
      margin-bottom: 6px;
    }

    .pct-bar-bg {
      height: 18px;
      background: #ffffff15;
      border-radius: 50px;
      overflow: hidden;
    }

    .pct-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #f5c518, #ff9800);
      border-radius: 50px;
      width: 50%;
      transition: width 0.5s ease;
    }

    /* ── HISTORY ── */
    .history-section {
      width: 100%;
      max-width: 420px;
    }

    .history-title {
      font-size: 0.78rem;
      letter-spacing: 2px;
      color: #888;
      margin-bottom: 10px;
      text-align: center;
    }

    .history-list {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .history-chip {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1px;
      border: 3px solid transparent;
      animation: chipIn 0.35s ease;
    }

    @keyframes chipIn {
      from { transform: scale(0) rotate(-180deg); opacity: 0; }
      to   { transform: scale(1) rotate(0deg);   opacity: 1; }
    }

    .history-chip.heads {
      background: linear-gradient(135deg, #ffd700, #b8860b);
      color: #3d2800;
      border-color: #f5c518;
    }

    .history-chip.tails {
      background: linear-gradient(135deg, #c0c0c0, #696969);
      color: #1a1a1a;
      border-color: #aaa;
    }

    .history-chip.empty {
      background: #ffffff0a;
      border-color: #ffffff18;
    }

    /* ══════════════════════════════════════
       ATLA UNIVERSE THEME
    ══════════════════════════════════════ */
    body.atla {
      background: linear-gradient(180deg,
        #87CEEB 0%, #aadde8 18%, #c8e8a0 42%,
        #72b040 62%, #4a8828 80%, #2d6016 100%);
    }
    body.atla h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.9rem;
      color: #7a3a08;
      text-shadow: 1px 2px 6px rgba(0,0,0,0.35), 0 0 18px rgba(212,168,67,0.5);
    }
    body.atla .subtitle { color: #4a2a0a; }
    body.atla .stat-box  { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.35); }
    body.atla .stat-value.heads-color { color: #1e6faa; }
    body.atla .stat-value.tails-color { color: #bb1f00; }
    body.atla .stat-value.total-color { color: #357a25; }
    body.atla .pct-labels  { color: #3d2010; }
    body.atla .pct-bar-bg  { background: rgba(0,0,0,0.18); }
    body.atla .pct-bar-fill{ background: linear-gradient(90deg,#2980B9,#4A8A3A); }
    body.atla .history-title { color: #4a2a0a; }
    body.atla .welcome-badge { color: #7a3a08; border-color: rgba(139,69,19,0.4); background: rgba(255,255,255,0.15); }

    /* ATLA coin face canvas */
    #atlaFace {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border-radius: 50%; display: none;
    }

    /* Universe switcher panel */
    #universeSwitcher {
      position: fixed; right: 16px; top: 50%;
      transform: translateY(-50%);
      flex-direction: column; gap: 8px; z-index: 100;
    }
    .uni-label { font-size: 0.58rem; color: #888; text-align: center; letter-spacing: 1px; margin-bottom: 2px; }
    .uni-btn {
      padding: 9px 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05); color: #aaa;
      font-size: 0.7rem; font-weight: 700; cursor: pointer;
      letter-spacing: 0.5px; transition: all 0.2s; text-align: center;
    }
    .uni-btn:hover  { background: rgba(255,255,255,0.12); color: #fff; }
    .uni-btn:active { transform: scale(0.95); }
    .uni-btn.active { background: rgba(245,197,24,0.15); border-color: rgba(245,197,24,0.55); color: #f5c518; }
    body.atla .uni-btn.active { background: rgba(139,69,19,0.22); border-color: rgba(139,69,19,0.7); color: #8B4513; }

    /* ATLA result badge variants */
    .result-badge.water  { background:linear-gradient(90deg,#2980B9,#1a5a8a); color:#e8f4fd; box-shadow:0 4px 20px #2980B966; }
    .result-badge.air    { background:linear-gradient(90deg,#C8A45A,#8B6520); color:#fff8e8; box-shadow:0 4px 20px #C8A45A77; }
    .result-badge.earth  { background:linear-gradient(90deg,#4A8A3A,#2d5a22); color:#d4f4c4; box-shadow:0 4px 20px #4A8A3A66; }
    .result-badge.fire   { background:linear-gradient(90deg,#CC2200,#8B1500); color:#ffe4d4; box-shadow:0 4px 20px #CC220066; }
    .result-badge.avatar { background:linear-gradient(90deg,#D4A843,#8B6010); color:#fff;    box-shadow:0 4px 30px #D4A84388; }

    /* ATLA history chips */
    .history-chip.water  { background:linear-gradient(135deg,#4A90D9,#1a5080); color:#fff;    border-color:#4A90D9; }
    .history-chip.air    { background:linear-gradient(135deg,#E8C878,#A07840); color:#3d2800; border-color:#C8A860; }
    .history-chip.earth  { background:linear-gradient(135deg,#5A9A4A,#2d5a22); color:#fff;    border-color:#4A8A3A; }
    .history-chip.fire   { background:linear-gradient(135deg,#DD3311,#7b1000); color:#fff;    border-color:#CC2200; }
    .history-chip.avatar { background:linear-gradient(135deg,#D4A843,#8B6010); color:#fff;    border-color:#D4A843; }

    /* Element particle / avatar animation canvas */
    #elementCanvas {
      position: fixed; inset: 0; pointer-events: none; z-index: 300; opacity: 0;
    }
    #elementCanvas.active { opacity: 1; }

    /* Avatar page flash */
    @keyframes avatarFlash {
      0%  { opacity: 0; }  30% { opacity: 1; }  100% { opacity: 0; }
    }
    #avatarFlashEl { position:fixed;inset:0;pointer-events:none;z-index:290;
      background:radial-gradient(ellipse at center,rgba(212,168,67,0.45) 0%,rgba(212,168,67,0) 70%);
      animation: none; }
    #avatarFlashEl.on { animation: avatarFlash 1.8s ease-out forwards; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="login-box">
      <h2>🪙 Coin Flip</h2>
      <p>ENTER TO PLAY</p>
      <input type="text" id="loginUsername" placeholder="Username" maxlength="20" />
      <input type="password" id="loginPassword" placeholder="Password" />
      <button onclick="doLogin()">LET'S FLIP</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- KAMUI CANVAS -->
  <canvas id="kamuiCanvas"></canvas>

  <!-- ELEMENT PARTICLE CANVAS -->
  <canvas id="elementCanvas"></canvas>

  <!-- AVATAR FLASH OVERLAY -->
  <div id="avatarFlashEl"></div>

  <!-- UNIVERSE SWITCHER -->
  <div id="universeSwitcher" style="display:none">
    <div class="uni-label">UNIVERSE</div>
    <button class="uni-btn active" id="btnBasic" onclick="setUniverse('basic')">⚔️ Basic</button>
    <button class="uni-btn" id="btnAtla" onclick="setUniverse('atla')">🌊 Avatar</button>
  </div>

  <!-- WELCOME BADGE -->
  <div class="welcome-badge" id="welcomeBadge" style="display:none"></div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" style="display:none; flex-direction:column; align-items:center; width:100%;">

  <h1>🪙 Coin Flip</h1>
  <p class="subtitle">HEADS OR TAILS?</p>

  <div class="coin-wrapper">
    <div class="coin" id="coin">
      <div class="coin-face coin-heads">
        <span id="coinHeadText">H</span>
        <canvas id="atlaFace" width="168" height="168"></canvas>
      </div>
      <div class="coin-face coin-tails">T</div>
    </div>
  </div>

  <div class="result-indicator">
    <div class="result-badge" id="resultBadge">HEADS</div>
  </div>

  <div class="btn-row">
    <button id="flipBtn" onclick="flipCoin()">FLIP</button>
    <button id="resetBtn" onclick="resetGame()">RESET</button>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-label" id="labelLeft">HEADS</div>
      <div class="stat-value heads-color" id="headsCount">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">TOTAL</div>
      <div class="stat-value total-color" id="totalCount">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label" id="labelRight">TAILS</div>
      <div class="stat-value tails-color" id="tailsCount">0</div>
    </div>
  </div>

  <div class="pct-section">
    <div class="pct-labels">
      <span id="headsPct">Heads — 0%</span>
      <span id="tailsPct">Tails — 0%</span>
    </div>
    <div class="pct-bar-bg">
      <div class="pct-bar-fill" id="pctBar"></div>
    </div>
  </div>

  <div class="history-section">
    <div class="history-title">LAST 5 RESULTS</div>
    <div class="history-list" id="historyList"></div>
  </div>

  </div> <!-- end gameScreen -->

  <script>
    let heads = 0, tails = 0, history = [], flipping = false;
    let currentUser = '';

    function doLogin() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const err = document.getElementById('loginError');

      if (!username) { err.textContent = 'Please enter a username.'; return; }
      if (!password)  { err.textContent = 'Please enter a password.'; return; }

      currentUser = username;
      document.getElementById('loginScreen').style.display = 'none';
      const game = document.getElementById('gameScreen');
      game.style.display = 'flex';
      const badge = document.getElementById('welcomeBadge');
      badge.style.display = 'block';
      badge.textContent = '👤 ' + currentUser;
      document.getElementById('universeSwitcher').style.display = 'flex';
    }

    // Allow pressing Enter to log in
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && document.getElementById('loginScreen').style.display !== 'none') {
        doLogin();
      }
    });

    function flipCoin() {
      if (universe === 'atla') { atlaFlipCoin(); return; }
      if (flipping) return;
      flipping = true;

      const coin = document.getElementById('coin');
      const btn  = document.getElementById('flipBtn');
      const badge = document.getElementById('resultBadge');
      btn.disabled = true;
      badge.classList.remove('visible');

      const isHeads = Math.random() < 0.5;

      coin.classList.remove('flipping', 'show-tails');
      void coin.offsetWidth; // reflow to restart animation

      coin.classList.add('flipping');

      setTimeout(() => {
        coin.classList.remove('flipping');
        if (!isHeads) coin.classList.add('show-tails');

        if (isHeads) heads++; else tails++;
        history.push(isHeads ? 'H' : 'T');
        if (history.length > 5) history.shift();

        badge.className = 'result-badge ' + (isHeads ? 'heads' : 'tails');
        badge.textContent = isHeads ? 'HEADS' : 'TAILS';
        badge.classList.add('visible');

        updateUI();
        btn.disabled = false;
        flipping = false;
      }, 1250);
    }

    function resetGame() {
      const btn = document.getElementById('resetBtn');
      const game = document.getElementById('gameScreen');
      if (btn.classList.contains('pulsing') || game.classList.contains('kamui-out')) return;

      // 1 — button pulse

    // ── KAMUI CANVAS VORTEX ──
    let kamuiRAF = null;

    // Pre-compute burst lines once — no per-frame flicker
    const BURST_LINES = (() => {
      const s = [0.12,0.87,0.34,0.56,0.78,0.23,0.65,0.43,0.91,0.07,0.38,0.72,0.19,
                 0.55,0.84,0.29,0.61,0.47,0.93,0.15,0.68,0.32,0.81,0.04,0.50,0.96,
                 0.25,0.74,0.41,0.63,0.09,0.88,0.36,0.52,0.77,0.21,0.66,0.44,0.98,
                 0.13,0.57,0.82,0.28,0.70,0.40,0.95,0.17,0.60,0.35,0.80,0.03,0.49,
                 0.92,0.26,0.75,0.48,0.10,0.86,0.33,0.58,0.76,0.22,0.64,0.42,0.99];
      return Array.from({length:90}, (_,i) => ({
        a:     (i/90)*Math.PI*2,
        len:   1.4 + s[i%s.length]*2.4,
        w:     0.3 + s[(i+17)%s.length]*2.2,
        alpha: 0.15 + s[(i+31)%s.length]*0.45,
      }));
    })();

    function drawSharingan(ctx, cx, cy, alpha, spin) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.globalAlpha = alpha;

      const R = 86;

      // ── Red energy burst background ──
      for (const l of BURST_LINES) {
        const a = l.a + spin * 0.05;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*R*1.04, Math.sin(a)*R*1.04);
        ctx.lineTo(Math.cos(a)*R*l.len, Math.sin(a)*R*l.len);
        ctx.strokeStyle = `rgba(155,0,0,${l.alpha})`;
        ctx.lineWidth = l.w; ctx.stroke();
      }

      // ── Outer glow halo ──
      const halo = ctx.createRadialGradient(0,0,R*0.4, 0,0,R*3.0);
      halo.addColorStop(0,   'rgba(220,0,0,0.70)');
      halo.addColorStop(0.35,'rgba(140,0,0,0.32)');
      halo.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(0,0,R*3.0,0,Math.PI*2);
      ctx.fillStyle = halo; ctx.fill();

      // ── Red iris (inside outer ring) ──
      const iris = ctx.createRadialGradient(0,-R*0.05,0, 0,0,R*0.86);
      iris.addColorStop(0,   '#e81500');
      iris.addColorStop(0.6, '#9a0000');
      iris.addColorStop(1,   '#3a0000');
      ctx.beginPath(); ctx.arc(0,0,R*0.86,0,Math.PI*2);
      ctx.fillStyle = iris; ctx.fill();

      // ── THICK outer black ring ──
      ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2);
      ctx.strokeStyle = '#000'; ctx.lineWidth = R*0.28; ctx.stroke();

      // ── All inner design rotates together ──
      ctx.save();
      ctx.rotate(spin - Math.PI/2); // start with one tomoe at top

      const iR = R * 0.64;   // inner ring radius
      const hR = R * 0.165;  // center hub radius

      // blade arc vs gap arc — must sum to 2π/3
      const bladeArc = 1.55;                      // ~88.8°
      const gapArc   = (Math.PI*2/3) - bladeArc; // ~31.2° per tomoe gap

      // ── Fan blades (filled annular sectors) ──
      ctx.fillStyle = '#000';
      for (let i = 0; i < 3; i++) {
        const a1 = i*(Math.PI*2/3) + gapArc/2;
        const a2 = a1 + bladeArc;
        ctx.beginPath();
        ctx.arc(0, 0, iR, a1, a2);          // outer arc
        ctx.arc(0, 0, hR, a2, a1, true);    // inner arc (hub edge)
        ctx.closePath();
        ctx.fill();
      }

      // ── Inner ring (on top of blades) ──
      ctx.beginPath(); ctx.arc(0,0,iR,0,Math.PI*2);
      ctx.strokeStyle = '#000'; ctx.lineWidth = R*0.075; ctx.stroke();

      // ── Center hub ──
      ctx.beginPath(); ctx.arc(0,0,hR,0,Math.PI*2);
      ctx.fillStyle = '#000'; ctx.fill();

      // ── Tomoe — at gap centers (0°, 120°, 240°) ──
      const tHead = R * 0.105;   // head radius
      const tTail = R * 0.095;   // tail arc radius
      for (let i = 0; i < 3; i++) {
        const a  = i * (Math.PI*2/3);   // gap center
        const tx = Math.cos(a) * iR;
        const ty = Math.sin(a) * iR;

        ctx.save();
        ctx.translate(tx, ty);
        ctx.rotate(a + Math.PI/2);

        // head
        ctx.beginPath(); ctx.arc(0, 0, tHead, 0, Math.PI*2);
        ctx.fillStyle = '#000'; ctx.fill();

        // tail — sweeping arc inward
        ctx.beginPath();
        ctx.arc(tTail*0.8, 0, tTail, Math.PI*0.88, Math.PI*2.08);
        ctx.strokeStyle = '#000';
        ctx.lineWidth   = tTail * 0.68;
        ctx.lineCap     = 'round';
        ctx.stroke();

        ctx.restore();
      }

      ctx.restore(); // end inner spin
      ctx.restore(); // end translate
    }

    function drawVortex(ctx, cx, cy, t, vortexProgress) {
      const arms = 6;
      for (let arm = 0; arm < arms; arm++) {
        const baseAngle = (arm / arms) * Math.PI * 2;
        const layers = 3;
        for (let l = 0; l < layers; l++) {
          ctx.beginPath();
          let first = true;
          const maxTurns  = 3.2;
          const maxRadius = 520 - vortexProgress * 180;
          for (let a = 0.01; a < Math.PI * 2 * maxTurns; a += 0.06) {
            const decay = Math.exp(-a * 0.22);
            const r = maxRadius * decay * (1 - vortexProgress * 0.55);
            if (r < 2) break;
            const wobble  = Math.sin(a * 3 + t * 0.08 + l) * (12 - l * 3);
            const angle   = a + baseAngle + vortexProgress * Math.PI * 2.5 + l * 0.25;
            const x = cx + Math.cos(angle) * (r + wobble);
            const y = cy + Math.sin(angle) * (r + wobble);
            first ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            first = false;
          }
          const palette = [
            `rgba(20,20,20,${0.92 - l*0.18})`,
            `rgba(90,90,90,${0.72 - l*0.16})`,
            `rgba(50,50,50,${0.80 - l*0.18})`,
          ];
          ctx.strokeStyle = palette[l % 3];
          ctx.lineWidth   = 30 - l * 7;
          ctx.lineCap     = 'round';
          ctx.lineJoin    = 'round';
          ctx.stroke();
        }
      }

      // dark center void
      const void_ = ctx.createRadialGradient(cx, cy, 0, cx, cy, 60);
      void_.addColorStop(0,   'rgba(0,0,0,0.92)');
      void_.addColorStop(0.6, 'rgba(10,0,0,0.5)');
      void_.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(cx, cy, 60, 0, Math.PI * 2);
      ctx.fillStyle = void_; ctx.fill();

      // center ember glow
      const ember = ctx.createRadialGradient(cx, cy, 0, cx, cy, 22);
      ember.addColorStop(0,   `rgba(200,200,200,${0.85 + Math.sin(t*0.25)*0.1})`);
      ember.addColorStop(0.5, 'rgba(100,100,100,0.5)');
      ember.addColorStop(1,   'rgba(30,30,30,0)');
      ctx.beginPath(); ctx.arc(cx, cy, 22, 0, Math.PI * 2);
      ctx.fillStyle = ember; ctx.fill();
    }

    function startKamui() {
      const canvas = document.getElementById('kamuiCanvas');
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.classList.add('active');
      const ctx = canvas.getContext('2d');
      const cx = canvas.width / 2, cy = canvas.height / 2;
      let t = 0;
      const SHARINGAN_END = 52;
      const VORTEX_START  = 38;

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // sharingan phase
        if (t < SHARINGAN_END) {
          const fadeIn  = Math.min(1, t / 18);
          const fadeOut = t > 36 ? Math.max(0, 1 - (t - 36) / 16) : 1;
          const alpha   = fadeIn * fadeOut * 0.80;
          drawSharingan(ctx, cx, cy, alpha, t * 0.035);
        }

        // vortex phase
        if (t > VORTEX_START) {
          const vp    = Math.min(1, (t - VORTEX_START) / 72);
          const alpha = Math.min(1, (t - VORTEX_START) / 18);
          ctx.save();
          ctx.globalAlpha = alpha;
          drawVortex(ctx, cx, cy, t, vp);
          ctx.restore();
        }

        t++;
        kamuiRAF = requestAnimationFrame(draw);
      }
      draw();
    }

    function stopKamui() {
      cancelAnimationFrame(kamuiRAF);
      const canvas = document.getElementById('kamuiCanvas');
      canvas.classList.remove('active');
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    }

    /* ── probabilities ── */
    function getAtlaResult() {
      const r = Math.random();
      if (r < 0.235) return 'water';
      if (r < 0.470) return 'air';
      if (r < 0.705) return 'earth';
      if (r < 0.940) return 'fire';
      return 'avatar';
    }

    /* ── ATLA flip ── */
    function atlaFlipCoin() {
      if (flipping) return;
      flipping = true;
      const coin  = document.getElementById('coin');
      const btn   = document.getElementById('flipBtn');
      const badge = document.getElementById('resultBadge');
      btn.disabled = true;
      badge.classList.remove('visible');

      const result = getAtlaResult();
      drawElementCoin(result);

      coin.classList.remove('flipping','show-tails');
      void coin.offsetWidth;
      coin.classList.add('flipping');

      setTimeout(() => {
        coin.classList.remove('flipping');
        atlaFlips[result]++;
        atlaHistory.push(result);
        if (atlaHistory.length > 5) atlaHistory.shift();

        const NAMES = {water:'WATER',air:'AIR',earth:'EARTH',fire:'FIRE',avatar:'AVATAR STATE'};
        badge.className   = 'result-badge ' + result;
        badge.textContent = NAMES[result];
        badge.classList.add('visible');

        if (result === 'avatar') showAvatarAnimation();
        else showElementParticles(result);

        updateAtlaUI();
        btn.disabled = false;
        flipping = false;
      }, 1250);
    }

    /* ══ ELEMENT COIN DRAWING ══ */
    function drawElementCoin(element) {
      const c = document.getElementById('atlaFace');
      const ctx = c.getContext('2d');
      ctx.clearRect(0,0,168,168);
      const cx=84, cy=84, r=80;
      ({water:drawWater,air:drawAir,earth:drawEarth,fire:drawFire,avatar:drawAvatar}[element])(ctx,cx,cy,r);
    }

    function drawWater(ctx,cx,cy,r) {
      // Katara necklace — deep blue with carved ocean waves
      const bg = ctx.createRadialGradient(cx-r*.15,cy-r*.15,0,cx,cy,r);
      bg.addColorStop(0,'#6bbde8'); bg.addColorStop(.7,'#1e6db0'); bg.addColorStop(1,'#0d3a62');
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=bg; ctx.fill();
      // outer ring
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.strokeStyle='#08203c'; ctx.lineWidth=r*.09; ctx.stroke();
      // inner ring
      ctx.beginPath(); ctx.arc(cx,cy,r*.78,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=r*.03; ctx.stroke();
      // 3 wave arcs
      ctx.strokeStyle='rgba(255,255,255,0.82)'; ctx.lineWidth=r*.055; ctx.lineCap='round';
      for (let i=0;i<3;i++) {
        const y0=cy+(i-1)*r*.28;
        ctx.beginPath();
        ctx.moveTo(cx-r*.52,y0);
        ctx.bezierCurveTo(cx-r*.18,y0-r*.17, cx+r*.18,y0+r*.17, cx+r*.52,y0);
        ctx.stroke();
      }
      // necklace bead dots
      ctx.fillStyle='rgba(255,255,255,0.35)';
      for (let i=0;i<14;i++) {
        const a=(i/14)*Math.PI*2;
        ctx.beginPath(); ctx.arc(cx+Math.cos(a)*r*.86, cy+Math.sin(a)*r*.86, r*.038,0,Math.PI*2); ctx.fill();
      }
    }

    function drawAir(ctx,cx,cy,r) {
      // Gyatso necklace — carved wood with Air Nomad triskelion
      const bg = ctx.createRadialGradient(cx-r*.1,cy-r*.1,0,cx,cy,r);
      bg.addColorStop(0,'#d4b483'); bg.addColorStop(.7,'#b08840'); bg.addColorStop(1,'#7a5a1a');
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=bg; ctx.fill();
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.strokeStyle='#4a2e08'; ctx.lineWidth=r*.09; ctx.stroke();
      // inner rope ring
      ctx.beginPath(); ctx.arc(cx,cy,r*.76,0,Math.PI*2);
      ctx.strokeStyle='#5a3810'; ctx.lineWidth=r*.035; ctx.stroke();
      // Air Nomad symbol — 3 circles arranged in triskelion
      ctx.strokeStyle='#3a2005'; ctx.lineWidth=r*.062; ctx.lineCap='round';
      for (let i=0;i<3;i++) {
        const a=(i/3)*Math.PI*2 - Math.PI/2;
        const sx=cx+Math.cos(a)*r*.28, sy=cy+Math.sin(a)*r*.28;
        ctx.beginPath(); ctx.arc(sx,sy,r*.22,a+Math.PI*.5,a+Math.PI*2.1); ctx.stroke();
      }
      // center dot
      ctx.beginPath(); ctx.arc(cx,cy,r*.065,0,Math.PI*2);
      ctx.fillStyle='#3a2005'; ctx.fill();
      // bead ring
      ctx.fillStyle='rgba(80,45,8,0.4)';
      for (let i=0;i<12;i++) {
        const a=(i/12)*Math.PI*2;
        ctx.beginPath(); ctx.arc(cx+Math.cos(a)*r*.88,cy+Math.sin(a)*r*.88,r*.04,0,Math.PI*2); ctx.fill();
      }
    }

    function drawEarth(ctx,cx,cy,r) {
      // Earth Kingdom — green with concentric square emblem
      const bg=ctx.createRadialGradient(cx,cy-r*.1,0,cx,cy,r);
      bg.addColorStop(0,'#5da050'); bg.addColorStop(.6,'#367028'); bg.addColorStop(1,'#1a3d10');
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=bg; ctx.fill();
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.strokeStyle='#000'; ctx.lineWidth=r*.11; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx,cy,r*.76,0,Math.PI*2);
      ctx.strokeStyle='#000'; ctx.lineWidth=r*.045; ctx.stroke();
      // outer square
      const s1=r*.44;
      ctx.beginPath(); ctx.rect(cx-s1,cy-s1,s1*2,s1*2);
      ctx.fillStyle='#000'; ctx.fill();
      // inner square (green cutout)
      const s2=s1*.52;
      ctx.beginPath(); ctx.rect(cx-s2,cy-s2,s2*2,s2*2);
      ctx.fillStyle='#367028'; ctx.fill();
      ctx.strokeStyle='#000'; ctx.lineWidth=r*.025; ctx.stroke();
    }

    function drawFire(ctx,cx,cy,r) {
      // Fire Nation emblem — red with black flame
      const bg=ctx.createRadialGradient(cx,cy-r*.1,0,cx,cy,r);
      bg.addColorStop(0,'#e03010'); bg.addColorStop(.6,'#a81800'); bg.addColorStop(1,'#4a0000');
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=bg; ctx.fill();
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.strokeStyle='#000'; ctx.lineWidth=r*.11; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx,cy,r*.76,0,Math.PI*2);
      ctx.strokeStyle='#000'; ctx.lineWidth=r*.045; ctx.stroke();
      // flame body
      ctx.fillStyle='#000';
      ctx.beginPath();
      ctx.moveTo(cx, cy+r*.52);
      ctx.bezierCurveTo(cx-r*.34,cy+r*.30, cx-r*.44,cy+r*.04, cx-r*.28,cy-r*.16);
      ctx.bezierCurveTo(cx-r*.16,cy-r*.32, cx-r*.04,cy-r*.22, cx,     cy-r*.50);
      ctx.bezierCurveTo(cx+r*.04,cy-r*.22, cx+r*.16,cy-r*.32, cx+r*.28,cy-r*.16);
      ctx.bezierCurveTo(cx+r*.44,cy+r*.04, cx+r*.34,cy+r*.30, cx,     cy+r*.52);
      ctx.fill();
      // inner flame cutout (red)
      const ig=ctx.createRadialGradient(cx,cy,0,cx,cy,r*.48);
      ig.addColorStop(0,'#e03010'); ig.addColorStop(1,'#a81800');
      ctx.fillStyle=ig;
      ctx.beginPath();
      ctx.moveTo(cx, cy+r*.30);
      ctx.bezierCurveTo(cx-r*.18,cy+r*.15, cx-r*.24,cy-r*.02, cx-r*.14,cy-r*.18);
      ctx.bezierCurveTo(cx-r*.06,cy-r*.30, cx,      cy-r*.18, cx,      cy-r*.38);
      ctx.bezierCurveTo(cx,      cy-r*.18, cx+r*.06,cy-r*.30, cx+r*.14,cy-r*.18);
      ctx.bezierCurveTo(cx+r*.24,cy-r*.02, cx+r*.18,cy+r*.15, cx,      cy+r*.30);
      ctx.fill();
    }

    function drawAvatar(ctx,cx,cy,r) {
      // Aang's head — warm tan with blue forehead arrow
      const bg=ctx.createRadialGradient(cx-r*.1,cy-r*.1,0,cx,cy,r);
      bg.addColorStop(0,'#e8c89a'); bg.addColorStop(.7,'#c8a070'); bg.addColorStop(1,'#9a7040');
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=bg; ctx.fill();
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.strokeStyle='#7a5020'; ctx.lineWidth=r*.07; ctx.stroke();
      // golden shimmer ring
      ctx.beginPath(); ctx.arc(cx,cy,r*.82,0,Math.PI*2);
      ctx.strokeStyle='rgba(212,168,67,0.5)'; ctx.lineWidth=r*.025; ctx.stroke();

      // Aang's arrow — blue shaft + arrowhead pointing down + two crown wings
      const blue='#4A90D9', blueDark='#2060A9';
      const sw=r*.13; // shaft width

      // shaft
      ctx.beginPath();
      ctx.roundRect(cx-sw/2, cy-r*.60, sw, r*.82, sw/2);
      ctx.fillStyle=blue; ctx.fill();
      ctx.strokeStyle=blueDark; ctx.lineWidth=r*.022; ctx.stroke();

      // arrowhead (pointing down)
      ctx.beginPath();
      ctx.moveTo(cx,       cy+r*.46);
      ctx.lineTo(cx-r*.30, cy+r*.16);
      ctx.lineTo(cx+r*.30, cy+r*.16);
      ctx.closePath();
      ctx.fillStyle=blue; ctx.fill();
      ctx.strokeStyle=blueDark; ctx.lineWidth=r*.022; ctx.stroke();

      // left crown wing
      ctx.beginPath();
      ctx.moveTo(cx-sw/2, cy-r*.42);
      ctx.bezierCurveTo(cx-r*.26,cy-r*.50, cx-r*.52,cy-r*.36, cx-r*.56,cy-r*.18);
      ctx.strokeStyle=blue; ctx.lineWidth=r*.065; ctx.lineCap='round'; ctx.stroke();
      // right crown wing
      ctx.beginPath();
      ctx.moveTo(cx+sw/2, cy-r*.42);
      ctx.bezierCurveTo(cx+r*.26,cy-r*.50, cx+r*.52,cy-r*.36, cx+r*.56,cy-r*.18);
      ctx.stroke();
    }

    /* ══ ELEMENT PARTICLE ANIMATIONS ══ */
    let elRAF = null;

    function showElementParticles(element) {
      cancelAnimationFrame(elRAF);
      const canvas = document.getElementById('elementCanvas');
      canvas.width=window.innerWidth; canvas.height=window.innerHeight;
      canvas.classList.add('active');
      const ctx=canvas.getContext('2d');
      const cx=canvas.width/2, cy=canvas.height/2;

      const CFG = {
        water: { cols:['#4A90D9','#1e6db0','#90c8f0'], shape:'drop',  vy:-1.5 },
        air:   { cols:['#e8d8a8','#c8b070','#f0e8d0'], shape:'circle',vy:-2   },
        earth: { cols:['#5A9A4A','#3a6a2a','#8ac870'], shape:'rect',  vy:-2.5 },
        fire:  { cols:['#ff5533','#dd2200','#ff9933'], shape:'flame', vy:-3   },
      };
      const cfg = CFG[element];

      const particles = Array.from({length:28},()=>({
        x: cx+(Math.random()-.5)*120,
        y: cy+(Math.random()-.5)*120,
        vx:(Math.random()-.5)*3.5,
        vy:cfg.vy - Math.random()*1.5,
        r: 5+Math.random()*9,
        col:cfg.cols[Math.floor(Math.random()*cfg.cols.length)],
        life:1, decay:.022+Math.random()*.018,
        rot: Math.random()*Math.PI*2,
      }));

      function frame() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        let alive=false;
        for (const p of particles) {
          if (p.life<=0) continue; alive=true;
          ctx.save(); ctx.globalAlpha=p.life;
          ctx.fillStyle=p.col; ctx.strokeStyle=p.col;
          ctx.translate(p.x,p.y); ctx.rotate(p.rot);
          if (cfg.shape==='drop') {
            ctx.beginPath(); ctx.ellipse(0,0,p.r*.6,p.r,0,0,Math.PI*2); ctx.fill();
          } else if (cfg.shape==='rect') {
            ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r);
          } else if (cfg.shape==='flame') {
            ctx.beginPath();
            ctx.moveTo(0,-p.r*1.1);
            ctx.bezierCurveTo(p.r*.7,0,p.r*.5,p.r*.7,0,p.r*.5);
            ctx.bezierCurveTo(-p.r*.5,p.r*.7,-p.r*.7,0,0,-p.r*1.1);
            ctx.fill();
          } else {
            ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill();
          }
          ctx.restore();
          p.x+=p.vx; p.y+=p.vy;
          if (element==='water') p.vy+=.12;
          if (element==='air')  { p.vx*=.97; p.vy*=.97; }
          if (element==='fire') p.vy-=.08;
          p.rot+=.04; p.r*=.98; p.life-=p.decay;
        }
        if (alive) elRAF=requestAnimationFrame(frame);
        else canvas.classList.remove('active');
      }
      frame();
    }

    function showAvatarAnimation() {
      cancelAnimationFrame(elRAF);
      // page flash
      const flash=document.getElementById('avatarFlashEl');
      flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');

      const canvas=document.getElementById('elementCanvas');
      canvas.width=window.innerWidth; canvas.height=window.innerHeight;
      canvas.classList.add('active');
      const ctx=canvas.getContext('2d');
      const cx=canvas.width/2, cy=canvas.height/2;

      // 4 element streams converging from 4 sides
      const STREAMS=[
        {col:'#4A90D9',ex:0,       ey:cy,    dx:1,  dy:0  }, // water from left
        {col:'#CC2200',ex:canvas.width,ey:cy, dx:-1, dy:0  }, // fire from right
        {col:'#5A9A4A',ex:cx,      ey:canvas.height,dx:0, dy:-1}, // earth from bottom
        {col:'#E8C860',ex:cx,      ey:0,     dx:0,  dy:1  }, // air from top
      ];

      const particles=[];
      for (const s of STREAMS) {
        for (let i=0;i<30;i++) {
          const dist=150+Math.random()*250;
          particles.push({
            x: s.ex + s.dx*dist + (Math.random()-.5)*80,
            y: s.ey + s.dy*dist + (Math.random()-.5)*80,
            vx: -s.dx*(2+Math.random()*2.5),
            vy: -s.dy*(2+Math.random()*2.5),
            r:  6+Math.random()*12,
            col:s.col, life:1, decay:.012+Math.random()*.01,
          });
        }
      }

      let t=0; const dur=130;
      function frame() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        // central golden pulse
        const prog=t/dur;
        const glowR=Math.sin(prog*Math.PI)*160;
        const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(1,glowR));
        glow.addColorStop(0,`rgba(212,168,67,${.55*Math.sin(prog*Math.PI)})`);
        glow.addColorStop(1,'rgba(212,168,67,0)');
        ctx.beginPath(); ctx.arc(cx,cy,Math.max(1,glowR),0,Math.PI*2);
        ctx.fillStyle=glow; ctx.fill();

        for (const p of particles) {
          if (p.life<=0) continue;
          ctx.save();
          ctx.globalAlpha=p.life*(1-prog*.6);
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
          ctx.fillStyle=p.col; ctx.fill();
          ctx.restore();
          p.x+=p.vx; p.y+=p.vy; p.vx*=.97; p.vy*=.97; p.life-=p.decay;
        }
        t++;
        if (t<dur) elRAF=requestAnimationFrame(frame);
        else canvas.classList.remove('active');
      }
      frame();
    }
  </script>
