<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coin Flip Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      padding: 20px;
    }

    /* ── LOGIN SCREEN ── */
    #loginScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .login-box {
      background: #ffffff0d;
      border: 1px solid #ffffff20;
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 60px #00000066;
    }

    .login-box h2 {
      font-size: 2rem;
      color: #f5c518;
      margin-bottom: 6px;
      letter-spacing: 2px;
    }

    .login-box p {
      color: #aaa;
      font-size: 0.85rem;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    .login-box input {
      width: 100%;
      padding: 13px 18px;
      border-radius: 50px;
      border: 1px solid #ffffff25;
      background: #ffffff0f;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-box input::placeholder { color: #888; }
    .login-box input:focus { border-color: #f5c51888; }

    .login-box button {
      width: 100%;
      padding: 13px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, #e94560, #c0392b);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 24px #e9456066;
      transition: transform 0.15s, box-shadow 0.15s;
      margin-top: 4px;
    }

    .login-box button:hover { transform: translateY(-2px); box-shadow: 0 8px 30px #e9456099; }
    .login-box button:active { transform: scale(0.97); }

    .login-error {
      color: #e94560;
      font-size: 0.82rem;
      margin-top: 10px;
      min-height: 18px;
    }

    .welcome-badge {
      position: fixed;
      top: 16px;
      right: 16px;
      background: #ffffff10;
      border: 1px solid #ffffff20;
      border-radius: 50px;
      padding: 7px 16px;
      font-size: 0.82rem;
      color: #f5c518;
      letter-spacing: 1px;
      z-index: 10;
    }

    #gameScreen { display: none; width: 100%; display: none; flex-direction: column; align-items: center; }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 6px;
      letter-spacing: 2px;
      text-shadow: 0 0 20px #e94560aa;
      color: #f5c518;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 36px;
      letter-spacing: 1px;
    }

    /* ── COIN ── */
    .coin-wrapper {
      width: 180px;
      height: 180px;
      perspective: 600px;
      margin-bottom: 32px;
    }

    .coin {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s;
    }

    .coin.flipping {
      animation: coinSpin 1.2s ease-out forwards;
    }

    @keyframes coinSpin {
      0%   { transform: rotateY(0deg) rotateX(0deg); }
      20%  { transform: rotateY(360deg) rotateX(20deg); }
      40%  { transform: rotateY(720deg) rotateX(0deg); }
      60%  { transform: rotateY(1080deg) rotateX(20deg); }
      80%  { transform: rotateY(1440deg) rotateX(0deg); }
      90%  { transform: rotateY(1620deg) rotateX(0deg); }
      100% { transform: rotateY(1800deg) rotateX(0deg); }
    }

    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      font-weight: 900;
      border: 6px solid #b8860b;
      box-shadow: 0 0 30px #f5c51866, inset 0 0 20px #00000044;
      user-select: none;
    }

    .coin-heads {
      background: radial-gradient(circle at 35% 35%, #ffd700, #b8860b 70%);
      color: #5a3e00;
    }

    .coin-tails {
      background: radial-gradient(circle at 35% 35%, #e8e8e8, #888 70%);
      color: #333;
      transform: rotateY(180deg);
    }

    /* show tails face when result is tails */
    .coin.show-tails {
      transform: rotateY(180deg);
    }

    /* ── RESULT INDICATOR ── */
    .result-indicator {
      height: 44px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .result-badge {
      padding: 8px 28px;
      border-radius: 50px;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 2px;
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.3s, transform 0.3s;
    }

    .result-badge.visible {
      opacity: 1;
      transform: scale(1);
    }

    .result-badge.heads {
      background: linear-gradient(90deg, #f5c518, #ff9800);
      color: #1a1a2e;
      box-shadow: 0 4px 20px #f5c51866;
    }

    .result-badge.tails {
      background: linear-gradient(90deg, #a8a8a8, #666);
      color: #fff;
      box-shadow: 0 4px 20px #ffffff33;
    }

    /* ── BUTTONS ── */
    .btn-row {
      display: flex;
      gap: 14px;
      margin-bottom: 36px;
    }

    button {
      padding: 14px 40px;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 1px;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    }

    button:active { transform: scale(0.96); }

    #flipBtn {
      background: linear-gradient(135deg, #e94560, #c0392b);
      color: #fff;
      box-shadow: 0 6px 24px #e9456066;
    }

    #flipBtn:hover:not(:disabled) { box-shadow: 0 8px 30px #e9456099; transform: translateY(-2px); }
    #flipBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    #flipBtn.holding {
      background: linear-gradient(135deg, #ff7c2a, #e94530);
      animation: saberPulse 0.65s ease-in-out infinite;
      position: relative;
      overflow: visible;
    }

    @keyframes saberPulse {
      0%   { box-shadow: 0 0 14px #ff8833cc, 0 0 32px #ff5c1aaa, 0 0 60px #ff3d0077, 0 0 90px #ff220044; }
      50%  { box-shadow: 0 0 22px #ffaa55ff, 0 0 50px #ff6622cc, 0 0 90px #ff4400aa, 0 0 130px #ff220066; }
      100% { box-shadow: 0 0 14px #ff8833cc, 0 0 32px #ff5c1aaa, 0 0 60px #ff3d0077, 0 0 90px #ff220044; }
    }

    #flipBtn.holding::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50px;
      border: 2.5px solid #ff9944dd;
      box-shadow: 0 0 10px #ff7733bb, 0 0 22px #ff550088;
      animation: ringPulse 0.65s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes ringPulse {
      0%   { inset: -6px;  opacity: 0.9; border-color: #ff9944dd; box-shadow: 0 0 10px #ff7733bb, 0 0 22px #ff550088; }
      50%  { inset: -16px; opacity: 1;   border-color: #ffbb66ff; box-shadow: 0 0 18px #ffaa44ff, 0 0 40px #ff6600bb; }
      100% { inset: -6px;  opacity: 0.9; border-color: #ff9944dd; box-shadow: 0 0 10px #ff7733bb, 0 0 22px #ff550088; }
    }

    #resetBtn {
      background: linear-gradient(135deg, #2d6a4f, #1b4332);
      color: #d8f3dc;
      box-shadow: 0 6px 24px #2d6a4f55;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
    }

    #resetBtn:hover { box-shadow: 0 8px 30px #2d6a4f88; transform: translateY(-2px); }

    #resetBtn.pulsing {
      animation: resetPulse 0.35s ease-out forwards;
    }

    @keyframes resetPulse {
      0%   { transform: scale(1);    box-shadow: 0 6px 24px #2d6a4f55; }
      40%  { transform: scale(1.18); box-shadow: 0 0 30px #7b2fff99, 0 0 60px #5500cc66; background: linear-gradient(135deg, #7b2fff, #4400bb); }
      100% { transform: scale(1);    box-shadow: 0 6px 24px #2d6a4f55; }
    }

    /* ── KAMUI OVERLAY ── */
    #kamuiCanvas {
      position: fixed;
      inset: 0;
      z-index: 500;
      pointer-events: none;
      opacity: 0;
    }

    #kamuiCanvas.active { opacity: 1; }

    #gameScreen.kamui-out {
      animation: kamuiSuck 1.1s cubic-bezier(0.6, 0, 1, 0.8) forwards;
    }

    #gameScreen.kamui-in {
      animation: kamuiReturn 0.7s cubic-bezier(0, 0.8, 0.4, 1) forwards;
    }

    @keyframes kamuiSuck {
      0%   { transform: scale(1)    rotate(0deg);   opacity: 1; filter: blur(0px); }
      60%  { transform: scale(0.55) rotate(180deg); opacity: 0.7; filter: blur(2px); }
      100% { transform: scale(0)    rotate(360deg); opacity: 0;   filter: blur(8px); }
    }

    @keyframes kamuiReturn {
      0%   { transform: scale(0)   rotate(-360deg); opacity: 0;   filter: blur(8px); }
      60%  { transform: scale(1.07) rotate(-15deg); opacity: 0.9; filter: blur(1px); }
      100% { transform: scale(1)   rotate(0deg);   opacity: 1;   filter: blur(0px); }
    }

    /* ── STATS ── */
    .stats {
      display: flex;
      gap: 24px;
      margin-bottom: 28px;
    }

    .stat-box {
      background: #ffffff0d;
      border: 1px solid #ffffff18;
      border-radius: 14px;
      padding: 14px 24px;
      text-align: center;
      min-width: 110px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #aaa;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .stat-value.heads-color { color: #f5c518; }
    .stat-value.tails-color { color: #b0b0b0; }
    .stat-value.total-color { color: #a29bfe; }

    /* ── PERCENTAGE BAR ── */
    .pct-section {
      width: 100%;
      max-width: 420px;
      margin-bottom: 32px;
    }

    .pct-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #ccc;
      margin-bottom: 6px;
    }

    .pct-bar-bg {
      height: 18px;
      background: #ffffff15;
      border-radius: 50px;
      overflow: hidden;
    }

    .pct-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #f5c518, #ff9800);
      border-radius: 50px;
      width: 50%;
      transition: width 0.5s ease;
    }

    /* ── HISTORY ── */
    .history-section {
      width: 100%;
      max-width: 420px;
    }

    .history-title {
      font-size: 0.78rem;
      letter-spacing: 2px;
      color: #888;
      margin-bottom: 10px;
      text-align: center;
    }

    .history-list {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .history-chip {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1px;
      border: 3px solid transparent;
      animation: chipIn 0.35s ease;
    }

    @keyframes chipIn {
      from { transform: scale(0) rotate(-180deg); opacity: 0; }
      to   { transform: scale(1) rotate(0deg);   opacity: 1; }
    }

    .history-chip.heads {
      background: linear-gradient(135deg, #ffd700, #b8860b);
      color: #3d2800;
      border-color: #f5c518;
    }

    .history-chip.tails {
      background: linear-gradient(135deg, #c0c0c0, #696969);
      color: #1a1a1a;
      border-color: #aaa;
    }

    .history-chip.empty {
      background: #ffffff0a;
      border-color: #ffffff18;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="login-box">
      <h2>🪙 Coin Flip</h2>
      <p>ENTER TO PLAY</p>
      <input type="text" id="loginUsername" placeholder="Username" maxlength="20" />
      <input type="password" id="loginPassword" placeholder="Password" />
      <button onclick="doLogin()">LET'S FLIP</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- KAMUI CANVAS -->
  <canvas id="kamuiCanvas"></canvas>

  <!-- WELCOME BADGE -->
  <div class="welcome-badge" id="welcomeBadge" style="display:none"></div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" style="display:none; flex-direction:column; align-items:center; width:100%;">

  <h1>🪙 Coin Flip</h1>
  <p class="subtitle">HEADS OR TAILS?</p>

  <div class="coin-wrapper">
    <div class="coin" id="coin">
      <div class="coin-face coin-heads">H</div>
      <div class="coin-face coin-tails">T</div>
    </div>
  </div>

  <div class="result-indicator">
    <div class="result-badge" id="resultBadge">HEADS</div>
  </div>

  <div class="btn-row">
    <button id="flipBtn" onclick="flipCoin()">FLIP</button>
    <button id="resetBtn" onclick="resetGame()">RESET</button>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="stat-label">HEADS</div>
      <div class="stat-value heads-color" id="headsCount">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">TOTAL</div>
      <div class="stat-value total-color" id="totalCount">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">TAILS</div>
      <div class="stat-value tails-color" id="tailsCount">0</div>
    </div>
  </div>

  <div class="pct-section">
    <div class="pct-labels">
      <span id="headsPct">Heads — 0%</span>
      <span id="tailsPct">Tails — 0%</span>
    </div>
    <div class="pct-bar-bg">
      <div class="pct-bar-fill" id="pctBar"></div>
    </div>
  </div>

  <div class="history-section">
    <div class="history-title">LAST 5 RESULTS</div>
    <div class="history-list" id="historyList"></div>
  </div>

  </div> <!-- end gameScreen -->

  <script>
    let heads = 0, tails = 0, history = [], flipping = false;
    let currentUser = '';

    function doLogin() {
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const err = document.getElementById('loginError');

      if (!username) { err.textContent = 'Please enter a username.'; return; }
      if (!password)  { err.textContent = 'Please enter a password.'; return; }

      currentUser = username;
      document.getElementById('loginScreen').style.display = 'none';
      const game = document.getElementById('gameScreen');
      game.style.display = 'flex';
      const badge = document.getElementById('welcomeBadge');
      badge.style.display = 'block';
      badge.textContent = '👤 ' + currentUser;
    }

    // Allow pressing Enter to log in
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && document.getElementById('loginScreen').style.display !== 'none') {
        doLogin();
      }
    });

    function flipCoin() {
      if (flipping) return;
      flipping = true;

      const coin = document.getElementById('coin');
      const btn  = document.getElementById('flipBtn');
      const badge = document.getElementById('resultBadge');
      btn.disabled = true;
      badge.classList.remove('visible');

      const isHeads = Math.random() < 0.5;

      coin.classList.remove('flipping', 'show-tails');
      void coin.offsetWidth; // reflow to restart animation

      coin.classList.add('flipping');

      setTimeout(() => {
        coin.classList.remove('flipping');
        if (!isHeads) coin.classList.add('show-tails');

        if (isHeads) heads++; else tails++;
        history.push(isHeads ? 'H' : 'T');
        if (history.length > 5) history.shift();

        badge.className = 'result-badge ' + (isHeads ? 'heads' : 'tails');
        badge.textContent = isHeads ? 'HEADS' : 'TAILS';
        badge.classList.add('visible');

        updateUI();
        btn.disabled = false;
        flipping = false;
      }, 1250);
    }

    function resetGame() {
      const btn = document.getElementById('resetBtn');
      const game = document.getElementById('gameScreen');
      if (btn.classList.contains('pulsing') || game.classList.contains('kamui-out')) return;

      // 1 — button pulse
      btn.classList.add('pulsing');
      setTimeout(() => btn.classList.remove('pulsing'), 350);

      // 2 — suck game out
      game.classList.add('kamui-out');
      startKamui();

      setTimeout(() => {
        // 3 — reset data while invisible
        heads = 0; tails = 0; history = [];
        const coin = document.getElementById('coin');
        coin.classList.remove('flipping', 'show-tails');
        document.getElementById('resultBadge').classList.remove('visible');
        updateUI();

        game.classList.remove('kamui-out');
        game.classList.add('kamui-in');
        stopKamui();

        // 4 — return animation done
        setTimeout(() => game.classList.remove('kamui-in'), 700);
      }, 1800);
    }

    // ── KAMUI CANVAS VORTEX ──
    let kamuiRAF = null;

    function drawSharingan(ctx, cx, cy, alpha, angle) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(angle);
      ctx.globalAlpha = alpha;

      const R = 62;

      // outer glow halo
      const halo = ctx.createRadialGradient(0, 0, R * 0.5, 0, 0, R * 2.2);
      halo.addColorStop(0, 'rgba(160,0,0,0.45)');
      halo.addColorStop(0.5, 'rgba(80,0,0,0.2)');
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(0, 0, R * 2.2, 0, Math.PI * 2);
      ctx.fillStyle = halo; ctx.fill();

      // iris
      const iris = ctx.createRadialGradient(-R*0.12, -R*0.12, 0, 0, 0, R);
      iris.addColorStop(0,   '#d42000');
      iris.addColorStop(0.55,'#8b0000');
      iris.addColorStop(1,   '#2a0000');
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2);
      ctx.fillStyle = iris; ctx.fill();

      // thin iris rim
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(60,0,0,0.8)'; ctx.lineWidth = 3; ctx.stroke();

      // Kakashi Mangekyou — 3 curved blades (triskelion)
      ctx.fillStyle = '#0d0000';
      for (let i = 0; i < 3; i++) {
        ctx.save();
        ctx.rotate((i * Math.PI * 2) / 3);
        ctx.beginPath();
        ctx.moveTo(0, R * 0.08);
        ctx.bezierCurveTo( R*0.22, -R*0.05,  R*0.72,  R*0.05,  R*0.68,  R*0.42);
        ctx.bezierCurveTo( R*0.60,  R*0.72,  R*0.12,  R*0.72,  R*0.04,  R*0.55);
        ctx.bezierCurveTo(-R*0.08,  R*0.35, -R*0.06,  R*0.18,  0,        R*0.08);
        ctx.fill();
        ctx.restore();
      }

      // inner circle connecting blades
      ctx.beginPath(); ctx.arc(0, 0, R * 0.22, 0, Math.PI * 2);
      ctx.fillStyle = '#0d0000'; ctx.fill();

      // pupil
      const pupil = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 0.14);
      pupil.addColorStop(0, '#1c0000'); pupil.addColorStop(1, '#000');
      ctx.beginPath(); ctx.arc(0, 0, R * 0.14, 0, Math.PI * 2);
      ctx.fillStyle = pupil; ctx.fill();

      // highlight glint
      ctx.beginPath(); ctx.arc(-R*0.18, -R*0.22, R*0.07, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,180,160,0.25)'; ctx.fill();

      ctx.restore();
    }

    function drawVortex(ctx, cx, cy, t, vortexProgress) {
      const arms = 6;
      for (let arm = 0; arm < arms; arm++) {
        const baseAngle = (arm / arms) * Math.PI * 2;
        const layers = 3;
        for (let l = 0; l < layers; l++) {
          ctx.beginPath();
          let first = true;
          const maxTurns  = 3.2;
          const maxRadius = 520 - vortexProgress * 180;
          for (let a = 0.01; a < Math.PI * 2 * maxTurns; a += 0.06) {
            const decay = Math.exp(-a * 0.22);
            const r = maxRadius * decay * (1 - vortexProgress * 0.55);
            if (r < 2) break;
            const wobble  = Math.sin(a * 3 + t * 0.08 + l) * (12 - l * 3);
            const angle   = a + baseAngle + vortexProgress * Math.PI * 2.5 + l * 0.25;
            const x = cx + Math.cos(angle) * (r + wobble);
            const y = cy + Math.sin(angle) * (r + wobble);
            first ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
            first = false;
          }
          const palette = [
            `rgba(170,18,2,${0.88 - l*0.18})`,
            `rgba(210,60,8,${0.72 - l*0.16})`,
            `rgba(60,4,0,${0.80  - l*0.18})`,
          ];
          ctx.strokeStyle = palette[l % 3];
          ctx.lineWidth   = 30 - l * 7;
          ctx.lineCap     = 'round';
          ctx.lineJoin    = 'round';
          ctx.stroke();
        }
      }

      // dark center void
      const void_ = ctx.createRadialGradient(cx, cy, 0, cx, cy, 60);
      void_.addColorStop(0,   'rgba(0,0,0,0.92)');
      void_.addColorStop(0.6, 'rgba(10,0,0,0.5)');
      void_.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.beginPath(); ctx.arc(cx, cy, 60, 0, Math.PI * 2);
      ctx.fillStyle = void_; ctx.fill();

      // center ember glow
      const ember = ctx.createRadialGradient(cx, cy, 0, cx, cy, 22);
      ember.addColorStop(0,   `rgba(255,110,40,${0.85 + Math.sin(t*0.25)*0.1})`);
      ember.addColorStop(0.5, 'rgba(180,20,0,0.5)');
      ember.addColorStop(1,   'rgba(80,0,0,0)');
      ctx.beginPath(); ctx.arc(cx, cy, 22, 0, Math.PI * 2);
      ctx.fillStyle = ember; ctx.fill();
    }

    function startKamui() {
      const canvas = document.getElementById('kamuiCanvas');
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.classList.add('active');
      const ctx = canvas.getContext('2d');
      const cx = canvas.width / 2, cy = canvas.height / 2;
      let t = 0;
      const SHARINGAN_END = 52;
      const VORTEX_START  = 38;

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // sharingan phase
        if (t < SHARINGAN_END) {
          const fadeIn  = Math.min(1, t / 18);
          const fadeOut = t > 36 ? Math.max(0, 1 - (t - 36) / 16) : 1;
          const alpha   = fadeIn * fadeOut * 0.80;
          drawSharingan(ctx, cx, cy, alpha, t * 0.035);
        }

        // vortex phase
        if (t > VORTEX_START) {
          const vp    = Math.min(1, (t - VORTEX_START) / 72);
          const alpha = Math.min(1, (t - VORTEX_START) / 18);
          ctx.save();
          ctx.globalAlpha = alpha;
          drawVortex(ctx, cx, cy, t, vp);
          ctx.restore();
        }

        t++;
        kamuiRAF = requestAnimationFrame(draw);
      }
      draw();
    }

    function stopKamui() {
      cancelAnimationFrame(kamuiRAF);
      const canvas = document.getElementById('kamuiCanvas');
      canvas.classList.remove('active');
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    }

    function updateUI() {
      const total = heads + tails;
      document.getElementById('headsCount').textContent = heads;
      document.getElementById('tailsCount').textContent = tails;
      document.getElementById('totalCount').textContent = total;

      const hPct = total ? Math.round((heads / total) * 100) : 0;
      const tPct = total ? 100 - hPct : 0;
      document.getElementById('headsPct').textContent = `Heads — ${hPct}%`;
      document.getElementById('tailsPct').textContent = `Tails — ${tPct}%`;
      document.getElementById('pctBar').style.width = (total ? hPct : 50) + '%';

      const list = document.getElementById('historyList');
      list.innerHTML = '';
      const slots = 5;
      for (let i = 0; i < slots; i++) {
        const chip = document.createElement('div');
        const idx = history.length - slots + i;
        if (idx >= 0) {
          chip.className = 'history-chip ' + (history[idx] === 'H' ? 'heads' : 'tails');
          chip.textContent = history[idx] === 'H' ? 'H' : 'T';
        } else {
          chip.className = 'history-chip empty';
        }
        list.appendChild(chip);
      }
    }

    updateUI();

    // Auto-flip on hold
    let holdTimer = null;
    let holdInterval = null;

    function startHold() {
      flipBtn.classList.add('holding');
      holdTimer = setTimeout(() => {
        holdInterval = setInterval(() => {
          if (!flipping) flipCoin();
        }, 750);
      }, 400);
    }

    function stopHold() {
      flipBtn.classList.remove('holding');
      clearTimeout(holdTimer);
      clearInterval(holdInterval);
      holdTimer = null;
      holdInterval = null;
    }

    const flipBtn = document.getElementById('flipBtn');
    flipBtn.addEventListener('mousedown', startHold);
    flipBtn.addEventListener('mouseup', stopHold);
    flipBtn.addEventListener('mouseleave', stopHold);
    flipBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startHold(); });
    flipBtn.addEventListener('touchend', stopHold);
  </script>
</body>
</html>
